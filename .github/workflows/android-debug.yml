name: Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [master, 'ci/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-debug-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android toolchain
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.1.0' 'ndk;29.0.14206865' 'cmake;3.31.5'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.31.5/bin" >> "$GITHUB_PATH"

      - name: Verify Gradle environment
        working-directory: android
        # Override the machine-specific Java path in gradle.properties.
        run: bash ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --version

      - name: Fetch pinned native sources
        run: |
          git submodule update --init external/fex
          git -C external/fex submodule update --init External/fmt External/range-v3 External/rpmalloc External/unordered_dense External/xxhash Source/Common/cpp-optparse
          bash tools/native/fetch-deps.sh

      - name: Run host HLE tests
        run: |
          # Work around existing test_pusher initializer and test_apu_hrtf libm issues.
          cmake -S tests/hle -B build/hle-tests-ci -G Ninja \
            -DNC_DEPS="$GITHUB_WORKSPACE/build/native-deps" \
            -DCMAKE_C_FLAGS=-Wno-error=missing-field-initializers \
            -DCMAKE_C_STANDARD_LIBRARIES=-lm
          cmake --build build/hle-tests-ci --parallel 2
          ctest --test-dir build/hle-tests-ci --output-on-failure

      - name: Build native core
        run: |
          cmake -S native -B build/native/core -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release -DNC_DEPS="$GITHUB_WORKSPACE/build/native-deps"
          cmake --build build/native/core --target hakuxcore --parallel 2
          bash tools/native/app-libs.sh

      - name: Run Android unit tests and assemble Debug APK
        working-directory: android
        run: bash ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" --no-daemon --max-workers=2 testDebugUnitTest assembleDebug --stacktrace

      - name: Verify APK contents and signature
        run: |
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          for lib in hakuxcore SDL3 main_hook file_redirect_hook gsl_alloc_hook kgsl_context_hook hook_impl; do
            unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/lib$lib.so"
          done
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload Debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hakuX-debug-arm64-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: test-reports-${{ github.sha }}
          path: |
            build/hle-tests-ci/Testing/Temporary/LastTest.log
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
